name: Проверки Python

on:
  pull_request:
    branches:
      - main
      # PR, открытые поверх другой ветки, тоже проверяются.
      - "feature/**"
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Тесты Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11"]

    steps:
      - name: Получить исходный код
        uses: actions/checkout@v7

      - name: Настроить Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Проверить обязательные файлы
        run: |
          test -f solution.py
          test -f llm_client.py
          test -f consultant_contracts.py
          test -f requirements.txt

      - name: Проверить синтаксис модулей
        run: PYTHONPYCACHEPREFIX="$RUNNER_TEMP/pycache" python -m py_compile solution.py llm_client.py consultant_contracts.py

      - name: Запустить unit-тесты
        run: python -m unittest discover -s tests -v

  backend:
    name: Backend API, Python 3.11
    runs-on: ubuntu-24.04

    steps:
      - name: Получить исходный код
        uses: actions/checkout@v7

      - name: Настроить Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Установить зависимости backend
        run: python -m pip install -r backend/requirements.txt

      - name: Проверить синтаксис backend
        run: PYTHONPYCACHEPREFIX="$RUNNER_TEMP/pycache" python -m py_compile backend/app.py backend/storage.py leads.py consultant_engine.py

      - name: Запустить все тесты вместе с API
        # Без FastAPI тесты API здесь падают, а не пропускаются.
        env:
          REQUIRE_API_TESTS: "1"
        run: python -m unittest discover -s tests -v
